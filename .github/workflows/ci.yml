name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows GUI executable
        shell: pwsh
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=ci-${{ github.sha }}" -o SpotlightGo.exe .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SpotlightGo-windows-amd64
          path: SpotlightGo.exe
          if-no-files-found: error
