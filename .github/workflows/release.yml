name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test and vet
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

      - name: Build release package
        shell: pwsh
        run: .\package-release.ps1 -Version "${{ github.ref_name }}"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist\SpotlightGo-${{ github.ref_name }}-windows-amd64.zip" "dist\SHA256SUMS.txt" --verify-tag --generate-notes --title "SpotlightGo ${{ github.ref_name }}"
